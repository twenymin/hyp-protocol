<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050608" />
  <title>HYP_PROTOCOL</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="./manifest.json" />

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HYP" />
  <link rel="apple-touch-icon" href="./apple-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body, #root {
      margin: 0; padding: 0;
      background: #050608;
      min-height: 100vh;
      min-height: 100dvh;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* allow text selection inside inputs only */
    input, textarea { -webkit-user-select: text; user-select: text; }

    /* loading state */
    #root:empty::before {
      content: 'HYP_PROTOCOL · loading...';
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #FFD60A;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>

  <!-- React 18 production builds -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Recharts requires PropTypes -->
  <script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Babel for in-browser JSX (small enough for our use case, ~250KB gzipped) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Compiled by Babel at runtime -->
  <script type="text/babel" data-presets="react" data-type="module" src="./game.js"></script>
</body>
</html>
