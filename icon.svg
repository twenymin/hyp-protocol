<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background with angle clip -->
  <defs>
    <clipPath id="angleClip">
      <polygon points="0,48 48,0 464,0 512,48 512,464 464,512 48,512 0,464"/>
    </clipPath>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="50%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFD60A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD60A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Black background with angle clip -->
  <g clip-path="url(#angleClip)">
    <rect width="512" height="512" fill="#0A0B0E"/>

    <!-- Subtle grid pattern -->
    <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
      <line x1="0" y1="64" x2="512" y2="64"/>
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="192" x2="512" y2="192"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="0" y1="448" x2="512" y2="448"/>
      <line x1="64" y1="0" x2="64" y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>
    </g>

    <!-- Glow halo -->
    <ellipse cx="256" cy="220" rx="220" ry="120" fill="url(#glow)"/>

    <!-- Glow effect for HYP text (blurred yellow underneath) -->
    <text x="256" y="290" font-family="Chakra Petch, sans-serif"
          font-size="170" font-weight="700"
          fill="#FFD60A" text-anchor="middle"
          letter-spacing="6"
          filter="url(#blur)" opacity="0.85">HYP</text>

    <!-- HYP text -->
    <text x="256" y="290" font-family="Chakra Petch, Arial, sans-serif"
          font-size="170" font-weight="700"
          fill="#FFD60A" text-anchor="middle"
          letter-spacing="6">HYP</text>

    <!-- Bracket markers, top-left and bottom-right -->
    <text x="40" y="68" font-family="JetBrains Mono, monospace"
          font-size="22" font-weight="700"
          fill="#FFD60A" letter-spacing="3" opacity="0.85">▸</text>
    <text x="442" y="486" font-family="JetBrains Mono, monospace"
          font-size="22" font-weight="700"
          fill="#FFD60A" letter-spacing="3" opacity="0.85">◂</text>

    <!-- Subtitle -->
    <text x="256" y="380" font-family="JetBrains Mono, monospace"
          font-size="22" font-weight="500"
          fill="#9BA1AB" text-anchor="middle"
          letter-spacing="8">PROTOCOL</text>
    <text x="256" y="420" font-family="JetBrains Mono, monospace"
          font-size="14"
          fill="#5C6370" text-anchor="middle"
          letter-spacing="6">v1 · 084d</text>
  </g>

  <!-- Yellow border (drawn outside clip for crispness) -->
  <polygon points="0,48 48,0 464,0 512,48 512,464 464,512 48,512 0,464"
           fill="none" stroke="url(#border)" stroke-width="6"/>
</svg>
